services:
  fastgithub:
    image: slcnx/fastgithub
    network_mode: host
    restart: always
    volumes:
    - cacert:/fastgithub/cacert/
  sample:
    depends_on:
    - fastgithub
    image: slcnx/ubuntu:18.04
    volumes:
    - cacert:/tmp/cacert
    - build_data:/build_data
    - ./scripts/docker-sample.sh:/usr/local/bin/fastgithub-sample.sh:ro
    working_dir: /build_data
    restart: "on-failure:3"
    entrypoint: ["sh", "/usr/local/bin/fastgithub-sample.sh"]
    command: ""
    environment:
      https_proxy: http://127.0.0.1:38457
      http_proxy: http://127.0.0.1:38457
    network_mode: host
  build:
    working_dir: /build_data
    depends_on:
      sample:
        condition: service_completed_successfully
    image: nginx
    volumes:
    - build_data:/build_data
volumes:
  cacert: {}
  build_data: {}
