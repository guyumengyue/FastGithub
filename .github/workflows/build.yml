name: Build FastGithub

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            runtime: linux-x64
          - os: windows-latest
            runtime: win-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '7.0.x'
      # The solution includes a Windows-only .NET Framework WPF application.
      - name: Test core
        run: dotnet test FastGithub.Tests/FastGithub.Tests.csproj -c Release -r ${{ matrix.runtime }} --self-contained false
      - name: Test Docker sample
        if: runner.os == 'Linux'
        run: python3 -m unittest discover -s tests -v
      - name: Validate Compose configuration
        if: runner.os == 'Linux'
        run: docker compose config --quiet
      - name: Build Windows UI
        if: runner.os == 'Windows'
        run: dotnet build FastGithub.UI/FastGithub.UI.csproj -c Release

  build-multi-platform:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            runtime: linux-x64
          - os: windows-latest
            runtime: win-x64
          - os: macos-latest
            runtime: osx-x64
          - os: macos-latest
            runtime: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '7.0.x'
      - name: Publish core
        run: dotnet publish FastGithub/FastGithub.csproj -c Release -r ${{ matrix.runtime }} --self-contained true -p:PublishSingleFile=true -o ./publish/${{ matrix.runtime }}
      - name: Publish UI
        if: runner.os == 'Windows'
        run: dotnet publish FastGithub.UI/FastGithub.UI.csproj -c Release -o ./publish/${{ matrix.runtime }}
      - name: Set executable permissions
        if: runner.os != 'Windows'
        run: chmod +x ./publish/${{ matrix.runtime }}/fastgithub ./publish/${{ matrix.runtime }}/dnscrypt-proxy/dnscrypt-proxy
      - uses: actions/upload-artifact@v4
        with:
          name: fastgithub-${{ matrix.runtime }}
          path: ./publish/${{ matrix.runtime }}
